# Servicios de apoyo para desarrollo. Aislados: red y volúmenes propios,
# puertos solo en loopback y límites de recursos para no afectar al host.
name: nubera

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
    ports:
      - "127.0.0.1:${NUBERA_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${NUBERA_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: 0.5

  icecast:
    build: ./icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?definir en .env}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?definir en .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?definir en .env}
    ports:
      - "127.0.0.1:${NUBERA_ICECAST_PORT:-58000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/status-json.xsl >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:?definir en .env}:${POSTGRES_PASSWORD:?definir en .env}@postgres:5432/${POSTGRES_DB:?definir en .env}
      MEDIA_DIR: /storage
      TRUST_PROXY: "false"
      NUBERA_PUBLIC_STREAM_URL: ${NUBERA_PUBLIC_STREAM_URL:-}
    ports:
      - "127.0.0.1:${NUBERA_API_PORT:-53000}:3000"
    volumes:
      - ../../data/storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  # Panel web. Habla con la API por la red interna; el navegador solo ve este servicio.
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      # Solo activar detrás de un proxy propio (Caddy, Cloudflare): usa X-Forwarded-For del cliente.
      NUBERA_TRUST_FORWARDED: "false"
    ports:
      - "127.0.0.1:${NUBERA_WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  # El motor de audio no depende de la API para arrancar: si ésta cae, sigue al
  # aire con la biblioteca local de emergencia.
  liquidsoap:
    image: savonet/liquidsoap:v2.4.x-latest
    restart: unless-stopped
    command: ["/etc/liquidsoap/radio.liq"]
    environment:
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?definir en .env}
      NUBERA_API_URL: http://api:3000
      NUBERA_AGENT_TOKEN: ${NUBERA_AGENT_TOKEN:-}
      NUBERA_STORAGE_DIR: /storage
    volumes:
      - ../liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ../../data/media:/media:ro
      - ../../data/storage:/storage:ro
    depends_on:
      icecast:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

volumes:
  postgres-data:
  redis-data:
